# Proposta de mudança de 29/10/2026 (forja da montagem do Setup): o Setup fica
# só com o físico e a memória com toda a regulagem. Entram a 8f e a 10c antes
# da 12b, para a 12b testar no aparelho o modelo novo.
- id: "8f"
  title: Setup só físico, memória com toda a regulagem e fichas com origem
  description: >-
    A regra das camadas muda: a regulagem vai para a memória com o valor
    final, o Setup fica com equipamentos e fichas, o link sai sozinho das
    ligações e o equilíbrio sai. Conferência ao conectar pela última memória
    aplicada (muta com corte, atraso, fase ou rota diferentes, ou sem
    memória; só avisa com ganho, limitador, EQ ou MASTER diferentes). Fichas
    com os campos novos e a origem de cada dado, base de modelos no celular,
    herdado sem memórias e sem presets, setups.json no formato 3 (começa do
    zero: apaga as memórias e os presets do celular e mantém os Setups e os
    equipamentos), e a regra do Continuar a cada 3 ajustes seguidos da IA.
  invoke_dev_with: >-
    _bmad-output/planning-artifacts/sprint-change-proposal-2026-10-29.md e
    _bmad-output/forge/montagem-do-setup/forged-idea.md. Tudo contra o
    ProcessadorSimulado. Sem telas. Nenhum 240 ou 23N: as memórias do
    aparelho são intocáveis.
- id: "10c"
  title: Telas do Setup físico e da memória completa
  description: >-
    Salvar por camadas sem calibração, Setup em dúvida contra a memória
