    formato novo, com migração). Testado contra o ProcessadorSimulado.
- id: "13d"
  title: Análise da playlist e teto do Extra
  description: >-
    Análise digital das faixas pela cadeia simulada no tempo, por saída
    (picos, trechos fortes e média); teto do Extra por preset, "quem está
    pesando" e música nova analisada antes de tocar (spec-rendimento
    CAP-5).
  invoke_dev_with: >-
    A análise roda no núcleo sobre PCM; a decodificação dos arquivos fica
    atrás de uma interface do Android, com dublê nos testes (faixas
    sintéticas com picos conhecidos). Referência do método:
    _bmad-output/regulagem/playlist/analisar.py (consulta).
- id: "13e"
  title: Teste a seco, fiscal do clip e exclusividade
  description: >-
    Teste a seco com o módulo desligado e os trechos fortes; clip como
    fiscal no uso; "revalidar"; outro player muta e pausa; volume do
    celular travado (spec-rendimento CAP-6, CAP-8).
  invoke_dev_with: >-
    limites-e-niveis.md, seções "Teste a seco" e "Fiscal no uso do
    Extra". O simulador passa a emitir o clip (150) por nível de sinal,
    marcado como suposição. Detectar outro player e travar o volume ficam
    atrás de interfaces, com dublês. Estado seguro numa falha: módulo
    desligado ou mudo no aparelho.
- id: "13f"
  title: Extra térmico
  description: >-
    Campos térmicos na ficha do alto-falante, temperatura ambiente do
    Setup, modelo de duas constantes com a média da análise, corte na
    temperatura máxima e descanso com o 251 desligado e o mute 100 até a
    temperatura ambiente (spec-rendimento CAP-7).
  invoke_dev_with: >-
    limites-e-niveis.md, "Extra térmico". Sem dados térmicos, o Extra não
    aparece; com dado só digitado, leva o selo "estimado". Conferir com a
    solução analítica do modelo, dentro de 5 %.
- id: "13g"
  title: Telas do Rendimento
  description: >-
    XAML das telas de telas-rendimento.md: limite da saída, recusa da
    cerca, calibração guiada, nível da memória, aviso do Máximo,
