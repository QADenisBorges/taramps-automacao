# Ordem de entrega do POC 1 (replanejada em 21/10/2026 com o Denis).
# 1 e 2 já foram feitas no aparelho. De 3 a 11, tudo é desenvolvido sem o processador:
# o mock (processador simulado) vive só nos testes, nunca no APK. A 12 liga tudo no
# aparelho real. As antigas histórias 3 (telas de leitura) e 4 (paridade) foram
# absorvidas pelas novas 10–11 e 12.
- id: "1"
  title: Esqueleto do app Android e conexão com o processador
  description: >-
    Cria o app, encontra o PRO 2.4BT, conecta pelo BLE, autentica com a senha
    e lê o firmware, entrando em modo só leitura se não for R003 (CAP-1).
  spec_checkpoint: true
  done_checkpoint: true
- id: "2"
  title: Catálogo de parâmetros e leitura completa do aparelho
  description: >-
    Codifica e decodifica cada parâmetro do MAPA §4, mais o gerador, a
    monitoração e os nomes das memórias, e faz a leitura completa (CAP-2).
- id: "3"
  title: UX design do app
  description: >-
    DESIGN.md (como o app parece) e EXPERIENCE.md (como ele se comporta) para
    todas as telas do POC: leitura, ajustes, link, memórias, presets, gerador,
    monitoração, aparelho, chaves de acesso, porta da IA e histórico.
  invoke_dev_with: >-
    Use a skill bmad-ux, de forma interativa com o Denis. As telas das
    histórias 10 e 11 seguem estes dois documentos.
- id: "4"
  title: Infraestrutura de testes com o processador simulado
  description: >-
    Projeto BgsControle.Telas (net10.0, sem MAUI) com os ViewModels, o
    ConexaoViewModel movido para lá e testado, a leitura automática ao entrar
    em Conectado descida para o núcleo, e o ProcessadorSimulado só nos testes.
  invoke_dev_with: >-
    O simulador imita o formato real do MAPA §2 e §9 e marca cada suposição
    não medida numa lista que a história 12 confere. Um teste garante que o
    App não referencia o Simulador. Fecha o item do deferred-work sobre a
    leitura automática sem teste.
- id: "5"
  title: Escrita de ajustes e chaves de acesso
  description: >-
    A trava passa a aceitar a escrita do catálogo com a chave ligada e fora do
    modo só leitura, sempre pela porta única da sessão; escritor com eco e
    releitura, ritmo de 30 ms e 300 ms por parâmetro; espelho do estado;
    chaves de acesso persistidas com aviso do risco (CAP-3, CAP-11).
  invoke_dev_with: >-
    Padrões e avisos das chaves em chaves-de-acesso.md. Tudo testado contra o
    ProcessadorSimulado.
- id: "6"
  title: Memórias, link de canais e cópia antes de mexer
  description: >-
    Salvar, carregar (com releitura) e nomear as 3 memórias; link 1–2 e 3–4;
    cópia antes de aplicar e "aplicado pela metade"; aviso ao sobrescrever
    uma memória (CAP-3, CAP-4, CAP-14).
  invoke_dev_with: >-
    Regra 3 de failure-modes.md. O link é só do app (MAPA §6).
# A antiga história 7 (gerador, monitoração e comandos de aparelho inteiro) foi
# dividida em 22/10/2026, como o plano previa: a spec passava muito do tamanho.
- id: "7a"
  title: Gerador de sinal e as regras de falha 1 e 2
  description: >-
    Tom fixo e sweep com prazo de 30 s; desligar ao fim do prazo, no Parar, ao
    fechar o app, ao desconectar, ao perder a conexão ou num erro; tentar
    reconectar até 3 vezes e então "DESLIGUE O MÓDULO AGORA"; ao reconectar,
    reler e desligar o gerador antes de qualquer outra ação (CAP-8).
  invoke_dev_with: >-
    Regras 1 e 2 de failure-modes.md. Núcleo e GeradorViewModel testados
    contra o ProcessadorSimulado; a tela é da história 11.
- id: "7b"
  title: Monitoração, remote out, Bluetooth de áudio e comandos de aparelho inteiro
  description: >-
    Voltímetro e clip ao vivo; remote out e Bluetooth de áudio; reset de
    fábrica, reset de áudio, troca de senha e nome do produto, cada um com a
    sua chave e com a releitura depois (CAP-7, CAP-9, CAP-10).
  invoke_dev_with: >-
    Chaves e riscos de chaves-de-acesso.md. Núcleo e ViewModels testados
    contra o ProcessadorSimulado; as telas são da história 11.
- id: "8"
  title: Presets no celular e conhecimento herdado
  description: >-
    Presets próprios no celular (salvar, aplicar, renomear, apagar) e o
    conhecimento herdado embutido na primeira abertura (CAP-5, CAP-6).
- id: "8b"
  title: Player com uma playlist por memória
  description: >-
    Uma playlist por memória, montada com arquivos de áudio do celular;
    tocar, pausar, pular e ordenar; o som vai pelo Bluetooth ao processador
    (CAP-15).
  invoke_dev_with: >-
    Decisão do Denis no UX de 21/10. Telas pela história 11; aqui ficam o
    núcleo (playlists por memória, persistência) e o ViewModel testado.
- id: "9a"
  title: Histórico, estado ao vivo e uso simultâneo
  description: >-
    Histórico com origem, hora e valor; estado ao vivo compartilhado entre a
    tela e a IA; pausa da IA no toque e janela de 10 s (CAP-13).
  invoke_dev_with: >-
    Regras de uso ao mesmo tempo em porta-de-comandos.md. Tudo no núcleo,
    sem rede.
- id: "9b"
  title: Porta de comandos da IA
  description: >-
    Porta HTTP na rede local, pareamento por código de 6 dígitos, recusa de
    fora da rede, confirmação na tela das operações de risco e "Parar IA"
    (CAP-12).
  invoke_dev_with: >-
    As cinco travas de porta-de-comandos.md. A senha do processador nunca
    trafega pela porta.
# Proposta de mudança de 23/10/2026 (planning-artifacts/sprint-change-proposal-2026-10-23.md):
# o app não edita as memórias do processador (só lê os nomes e carrega), ganha
# Setups, memórias no celular e preset só de 15 bandas. Entram 3b, 8c e 8d antes da 10.
# Ordem: 3b → 8c → 8d → 10 → 11 → 12.
- id: "3b"
  title: UX — Setup e memórias no celular
  description: >-
    Revisa o EXPERIENCE.md e o DESIGN.md para o Setup (escolha e conferência
    ao conectar), as memórias no celular em quantidade livre, o "Do aparelho"
    só para carregar, o preset de 15 bandas, o Player preso à memória do
    celular, os fluxos 1 e 4 refeitos e o fluxo novo de levar o processador
    para o carro (CAP-4, CAP-5, CAP-15, CAP-16).
  invoke_dev_with: >-
    Use a skill bmad-ux, de forma interativa com o Denis. A lista do que
    revisar está na seção 4.6 da proposta de mudança de 23/10. Primeira
    pergunta: com memórias em quantidade livre, os 3 botões do Início deixam
    de caber.
- id: "8c"
  title: Setup e memória no celular
  description: >-
    Setups (nome e calibração, escolha ao conectar, conferência com a última
    aplicação, mutar e pedir confirmação na dúvida, reaplicar a memória ativa
    se o processador perdeu o estado); memórias no celular (criar, aplicar,
    renomear, apagar), com ganho e limiter finais = memória + equilíbrio do
    Setup; carregar memória do aparelho continua e o salvar e o renomear no
    aparelho saem do código; a FILME herdada dividida em Setup, memória e
    preset (CAP-4, CAP-6, CAP-11, CAP-16).
  invoke_dev_with: >-
    Reaproveita a CopiaAntes, o Escritor e a releitura das histórias 5 e 6;
    nada é desfeito. Chaves novas em chaves-de-acesso.md e regra 5 de
    failure-modes.md. Divisão da FILME em conhecimento-herdado.md. Testado
    contra o ProcessadorSimulado, com um teste garantindo que nenhum 240 ou
    23N sai do app. Do UX da 3b (EXPERIENCE.md de 21/10, revisado em
    23/10): conferência do Setup só na dúvida, com a lista do que não
    bate e as saídas escolher, criar Setup do aparelho e seguir sem
    Setup; o núcleo guarda as 3 memórias usadas por último em cada Setup,
    fixas no lugar; um só Salvar que separa calibração (Setup) e caráter
    (memória); memória nova parte do som atual.
- id: "8d"
  title: Preset de 15 bandas e playlist da memória do celular
  description: >-
    O preset passa a ser só o EQ de 15 bandas, aplicado por cima da memória;
    a playlist fica presa ao id da memória do celular, com migração do
    playlists.json antigo (por posição); a porta da IA ganha "aplicar
    memória" (CAP-5, CAP-12, CAP-15).
  invoke_dev_with: >-
    Depende da 8c. O preset herdado é o "Cinema" de conhecimento-herdado.md.
    A migração das playlists por posição precisa de uma regra para quando a
    memória do celular correspondente não existir. Do UX da 3b: cada
    memória lembra o último preset e o traz ao ser aplicada; ao salvar 15
    bandas mexidas, atualizar o preset ou criar um novo (o herdado só
    gera novo); o Player mostra só a playlist da memória em uso.
# Proposta de mudança de 23/10/2026 (planning-artifacts/sprint-change-proposal-2026-10-23-equipamentos.md):
# o Setup ganha equipamentos e o modelo de ligação (canal → uma ou mais entradas
# de linha; quatro grupos; bridge do módulo); as saídas do app vêm do Setup; entra
# o esquema do Setup em 2D com sensação de 3D. Ordem: 8e → 10 → 10b → 11 → 12.
- id: "8e"
  title: Equipamentos, ligações e saídas do Setup
  description: >-
    Os equipamentos do Setup (quatro grupos, categorias abertas, função
    acústica, dados técnicos opcionais e "genérico"); as ligações (cada canal
    do processador para uma ou mais entradas de linha, repasse do grupo 3,
    canais e bridge do módulo, alto-falantes passivos nas saídas); as saídas
    do app derivadas do Setup (um canal, ou um par vizinho com link, que
    escreve nos dois), com nome e cor; o equilíbrio por saída no lugar do
    equilíbrio L/R; o Casa 2.1 herdado com os equipamentos e o Link 3–4
    ligado; a migração do setups.json (CAP-3, CAP-16).
  invoke_dev_with: >-
    Modelo de ligação na seção 2 da proposta de 23/10 (equipamentos) e na
    seção "Equipamentos e saídas" do EXPERIENCE.md; equipamentos do Casa 2.1
    em conhecimento-herdado.md. Reaproveita o Setup, o GerenteSetups, as
    Camadas e o LinkCanais da 8c; nada é desfeito. Inclui o ViewModel da
    lista e da folha de equipamento. Testado contra o ProcessadorSimulado.
- id: "10"
  title: Telas, parte 1 — leitura, ajustes, link, Setups, equipamentos e memórias
  description: >-
    XAML e navegação das telas de leitura e de ajuste por canal e globais,
    link, Setups (com a tela do Setup e a folha de equipamento) e memórias,
    seguindo o DESIGN.md e o EXPERIENCE.md; as abas, os cartões e os faders
    vêm das saídas do Setup (CAP-2, CAP-3, CAP-4, CAP-14, CAP-16).
  invoke_dev_with: >-
    Retoma a tentativa salva em
    _bmad-output/implementation-artifacts/historia-10-tentativa-1.patch
    (aplica limpo sobre a 8d; a spec bloqueada dela está em
    stories/arquivo/): aplicar o patch e trocar as saídas fixas (Saidas.cs)
    pelas saídas do Setup da 8e, e corrigir os achados "patch" do triage log
    da spec arquivada. O lugar do esquema na tela do Setup fica reservado
    para a 10b. Sem celular no adb, a conferência visual fica pendente.
- id: "10b"
  title: Esquema do Setup em 2D com sensação de 3D
  description: >-
    O esquema do Setup na tela Setup: desenho isométrico com profundidade e
    sombra no GraphicsView do MAUI; a forma de cada categoria gerada pelo
    código, em proporção pelos dados técnicos; processador, cabos e Y,
    equipamentos dos quatro grupos, saídas e bridge dos módulos e
    alto-falantes, na cor de cada canal; atualizado sozinho; arrastar,
    aproximar e tocar para abrir o equipamento (CAP-17).
  invoke_dev_with: >-
    Seção "Equipamentos e saídas" do EXPERIENCE.md e componente
    "esquema-do-setup" do DESIGN.md. Sem biblioteca nova e sem internet. A
    lógica de layout (posições, formas, proporções, o que um toque acerta)
    fica num ViewModel testável; o desenho só pinta.
- id: "11"
  title: Telas, parte 2 — gerador, monitoração, aparelho, chaves, presets, IA e histórico
  description: >-
    XAML e navegação das demais telas, seguindo o DESIGN.md e o EXPERIENCE.md,
    com as saídas do Setup onde houver saídas (CAP-5, CAP-7 a CAP-13, CAP-15).
  invoke_dev_with: >-
    Inclui a aba Player e as linhas de Configurações que a 10 deixou.
    Decisões do Denis de 24/10/2026: (1) quando o BLE cai, o Player continua
    tocando a playlist da memória que estava em uso (é Bluetooth de áudio,
    não o BLE) — corrige o item adiado da 8d; (2) sem Setup em uso (dúvida,
    trocando de Setup, Seguir sem Setup), os links 1–2 e 3–4 ficam
    desligados, e um Setup criado do aparelho nasce com eles desligados —
    fecha o item adiado da 8e.
