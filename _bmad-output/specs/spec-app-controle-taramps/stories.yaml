# Plano de 30/10/2026 (planning-artifacts/planejamento-final-2026-10-30.md): o
# teste no aparelho fica todo no fim. Entre a 10d e a 12b entram as histórias do
# Rendimento e depois as do Agente da memória, rodando contra o ProcessadorSimulado.
- id: "12b"
  title: Telas e aparelho inteiro no aparelho real
  description: >-
    Cada tela no A52 contra o aparelho: ajustes, Sub do Casa 2.1 escrevendo
    no CH3 e no CH4 juntos, link, Setups, esquema do Casa 2.1, memórias,
    presets, Player com áudio, gerador, voltímetro, clip, remote out,
    Bluetooth, nome do produto e chaves; as suposições que sobraram.
  done_checkpoint: true
  invoke_dev_with: >-
    Gerador só com o RCA dos módulos desconectado, e fechar o app com o tom
    tocando (deferred-work). Voltímetro contra o VC830L, com foto. Reset de
    fábrica, reset de áudio e troca de senha só na recusa. As pendências
    "no aparelho" das histórias 4 a 11 que são de tela. Conferir no aparelho
    a conferência nova (muta com corte diferente, reaplica sozinho com
    ganho diferente; proposta de 30/10), o link que sai sozinho do bridge e o app começando sem
    memórias; as 3 memórias do processador continuam como estavam. O app
    entra reinstalado limpo (8g): o Denis cadastra o Setup, os
    equipamentos e as fichas do zero no celular antes de conferir as telas.
- id: "12c"
  title: Porta da IA no Wi-Fi e testes 1, 2 e 4
  description: >-
    A porta 8787 no Wi-Fi real, com o Claude Code no notebook por curl
    (ligar "Controle pela rede" em Aparelho e parear, ler, ajustar, aplicar
    memória com a folha de risco, recusas, desligar a chave revoga o acesso,
    Continuar a cada 3 ajustes seguidos, tela ao vivo em até 1 s, nenhuma
    tela com "IA"); uma criação de memória pela porta, com o Claude Code
    mandando as perguntas à mão, até o Salvar do Denis;
    a MUSICA ORIG refeita pelo Denis só pelo celular; desligar e religar o
    processador (guarda o estado ou o app reaplica); o aparelho com corte,
    atraso, fase ou rota diferentes da última memória aplicada.
  done_checkpoint: true
  invoke_dev_with: >-
    Testes 1, 2 e 4 do sinal de sucesso do SPEC. Item IA1 da 9b (a porta
    inerte no app real).
- id: "12d"
  title: Rendimento no aparelho
  description: >-
    No A52 com o PRO 2.4BT, com o Setup cadastrado do zero pelo Denis:
    calibração contra o VC830L, ordem EQ/limitador, nível do Bluetooth do
    player do app, 150, 111 e 251, teste a seco real, fiscal do clip,
    outro player e volume travado.
  done_checkpoint: true
  invoke_dev_with: >-
    Sinal de sucesso 2 e Assumptions de spec-rendimento/SPEC.md e os
    [ASSUMPTION] de telas-rendimento.md. Teste a seco e calibração com os
    alto-falantes desligados do módulo; toda medida com a foto do VC830L.
    As 3 memórias do processador continuam como estavam.
- id: "12e"
  title: Agente de verdade — avaliação real e criação no aparelho
  description: >-
    A avaliação real contra os 8 ouvintes simulados, com o ok do Denis
    para o custo, e uma criação completa no A52: "+ Nova memória",
    perguntas, Aplicando, escuta "1 ou 2", Salvar, e uma proposta de ficha.
  done_checkpoint: true
  invoke_dev_with: >-
    Sinal de sucesso de spec-agente-memoria/SPEC.md e os [ASSUMPTION] de
    lado-do-app.md. Mostrar o custo estimado e esperar o ok antes de cada
    rodada real. Nenhuma tela com "IA"; as 3 memórias do processador
    continuam como estavam.
